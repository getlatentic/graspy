name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The npm in package.json's packageManager, as scripts/deploy.sh installs with.
      - name: Install with the pinned npm
        run: |
          npm="$(node scripts/pinned-npm.mjs)"
          npx --yes "$npm" ci --ignore-scripts
      - name: Web
        working-directory: apps/web
        run: |
          npx oxlint
          npx tsc -b
          npx vitest run
      - name: Tutor
        working-directory: apps/tutor
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Pedagogy test
        working-directory: apps/pedagogy
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Server admin UI
        working-directory: apps/server/ui
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Teacher
        working-directory: apps/teacher
        run: |
          npx oxlint
          npx tsgo --noEmit -p tsconfig.json
          npx vitest run
          python3 -m unittest discover -s scripts/tests -t .
      - name: Deploy scripts
        run: node --test 'scripts/tests/*.test.mjs'

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The real file stays out of git; the unit tests never reach Firebase.
      - run: cp google-services.stand-in.json app/google-services.json
      - run: ./gradlew testDebugUnitTest lintDebug assembleStaging
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: apps/mobile/app/build/reports

  # A hosted macOS minute counts ten against the organisation's allowance, so the teacher app's Rust job starts only when
  # something it is built from changed.
  teacher-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/teacher/|package(-lock)?\.json$|scripts/pinned-npm\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  teacher-rust:
    needs: teacher-changed
    # When the check of what changed did not finish, the job runs: a skipped job counts as passed, so it must not be skipped by a failure.
    if: ${{ !cancelled() && (needs.teacher-changed.result != 'success' || needs.teacher-changed.outputs.changed == 'true') }}
    # The sidecars target macOS arm64, and Tauri's build checks they exist.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Rust from apps/teacher/rust-toolchain.toml
        working-directory: apps/teacher
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/teacher/src-tauri
      # The npm in package.json's packageManager, as scripts/deploy.sh installs with.
      - name: Install with the pinned npm
        run: |
          npm="$(node scripts/pinned-npm.mjs)"
          npx --yes "$npm" ci --ignore-scripts
      - name: Frontend the app embeds
        working-directory: apps/teacher
        run: npx vite build
      # The tests that run a sidecar are ignored; the binaries only need to exist.
      - name: Stand-in sidecars
        working-directory: apps/teacher/src-tauri/binaries
        run: touch llama-server-aarch64-apple-darwin graspy-inference-runner-aarch64-apple-darwin
      - name: Clippy and tests
        working-directory: apps/teacher
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
