\* A logged, resumed turn whose append is not idempotent. Expected: AtMostOnce is violated by a crash after the append.
SPECIFICATION Spec
CONSTANTS
    Messages = {m1, m2}
    Durable = TRUE
    JoinsById = TRUE
    AppendIsIdempotent = FALSE
    MaxCrashes = 1
    MaxAttempts = 2
INVARIANTS TypeOK AtMostOnce ShownIsKept
PROPERTIES EventuallyKept
CHECK_DEADLOCK FALSE
