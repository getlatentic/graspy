\* What should hold: nothing is kept without consent, a lease takeover cannot
\* apply a verdict twice, nothing stays undecided past a day, kept audio goes at its expiry, and an upload
\* that did not finish is deleted, with no help from the client.
SPECIFICATION Spec
CONSTANTS
    Samples = {s1}
    MaxTime = 9
    Lease = 1
    Wait1 = 1
    Wait2 = 2
    UndecidedLimit = 5
    RetShort = 6
    RetLong = 7
    MaxAttempts = 3
    TutorDedupes = TRUE
    ClientRetriesUpload = FALSE
    SweepsStalledUploads = TRUE
INVARIANTS TypeOK AssessmentOnce KeptOnlyUnderConsent CompleteHasItsVerdict
PROPERTIES UndecidedIsDecided ExpiredIsGone StalledIsSwept
