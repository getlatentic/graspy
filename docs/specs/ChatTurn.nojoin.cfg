\* A logged, resumed turn that does not join by id but appends idempotently. Expected: every property holds: joining saves a model call, it does not keep the exchange single.
SPECIFICATION Spec
CONSTANTS
    Messages = {m1, m2}
    Durable = TRUE
    JoinsById = FALSE
    AppendIsIdempotent = TRUE
    MaxCrashes = 1
    MaxAttempts = 2
INVARIANTS TypeOK AtMostOnce ShownIsKept
PROPERTIES EventuallyKept
CHECK_DEADLOCK FALSE
