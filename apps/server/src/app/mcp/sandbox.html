<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>graspy view</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        color-scheme: inherit;
      }
    </style>
  </head>
  <body>
    <script>
      // MCP Apps' sandbox proxy: the host frames this page, on another
      // origin, and this page writes the view into a frame of its own. It
      // passes every message between the two, except the two addressed to
      // itself. The server lets only the host named in ?host= frame it, and
      // never one on its own origin, so the view is always isolated from it.
      (() => {
        "use strict";
        const PROXY_READY = "ui/notifications/sandbox-proxy-ready";
        const RESOURCE_READY = "ui/notifications/sandbox-resource-ready";
        const FEATURES = {
          camera: "camera",
          microphone: "microphone",
          geolocation: "geolocation",
          clipboardWrite: "clipboard-write",
        };
        const host = new URLSearchParams(location.search).get("host");
        if (window.self === window.top || !host) return;
        // Once installed, the worker serves this page and the view's files
        // when there is no connection. A browser that refuses it, such as
        // one blocking storage, still shows the view online.
        const worker =
          "serviceWorker" in navigator
            ? navigator.serviceWorker
                .register("/ui-sandbox-sw.js", { scope: "/ui-sandbox" })
                .then(() => navigator.serviceWorker.ready)
                .catch(() => null)
            : Promise.resolve(null);

        // The first visit loads before the worker controls it, so the
        // worker is told what this page and its view loaded, to keep.
        function keepForOffline(page) {
          const files = inner.contentWindow.performance
            .getEntriesByType("resource")
            .map((entry) => entry.name);
          worker.then((registration) =>
            registration?.active?.postMessage({
              type: "keep",
              urls: [location.href, page, ...files],
            }),
          );
        }
        const own = location.origin;
        let inner = null;

        // The view's frame loads a page of this origin, which the worker
        // controls and serves offline, with the policy the view declared;
        // the view is then written into it, so the worker serves its files.
        // The sandbox and permissions apply as that page loads.
        function load({ html, sandbox, permissions }) {
          if (inner || typeof html !== "string") return;
          inner = document.createElement("iframe");
          inner.setAttribute(
            "sandbox",
            typeof sandbox === "string"
              ? sandbox
              : "allow-scripts allow-same-origin allow-forms",
          );
          const allow = Object.keys(permissions || {})
            .filter((key) => key in FEATURES)
            .map((key) => FEATURES[key]);
          if (allow.length) inner.setAttribute("allow", allow.join("; "));
          const page = new URL(`/ui-sandbox-frame${location.search}`, own).href;
          inner.addEventListener(
            "load",
            () => {
              const doc = inner.contentDocument;
              doc.open();
              // Opening the document drops its listeners, and Chrome fires
              // no load for a written one: it is kept once its scripts ran.
              const kept = () => keepForOffline(page);
              doc.addEventListener("DOMContentLoaded", kept, { once: true });
              doc.write(html);
              doc.close();
            },
            { once: true },
          );
          inner.src = page;
          document.body.appendChild(inner);
        }

        window.addEventListener("message", (event) => {
          if (event.source === window.parent) {
            if (event.origin !== host) return;
            if (event.data && event.data.method === RESOURCE_READY) {
              load(event.data.params || {});
            } else if (inner?.contentWindow) {
              inner.contentWindow.postMessage(event.data, own);
            }
          } else if (inner && event.source === inner.contentWindow) {
            if (event.origin !== own) return;
            window.parent.postMessage(event.data, host);
          }
        });

        window.parent.postMessage(
          { jsonrpc: "2.0", method: PROXY_READY, params: {} },
          host,
        );
      })();
    </script>
  </body>
</html>
