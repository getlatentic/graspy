    <style>
      /* The first paint, before any script runs: the logo and a progress line on the canvas colours
         (design/tokens.css: canvas, track, accent, accent-strong, on-accent, in both schemes). Sizes
         are the loading screen's (src/components/loading-screen.tsx), so the hand-over moves nothing.
         src/app/boot-splash.ts takes it down once the app has drawn. After 8 seconds with no app the
         line gives way to a way to try again, with no script needed. */
      html { background: #f5f8fa; }
      #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483646; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; background: #f5f8fa; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      #boot svg { display: block; height: 2.5rem; width: auto; }
      #boot .slot { position: relative; display: flex; align-items: center; height: 3rem; }
      #boot .bar { width: 7rem; height: 0.25rem; overflow: hidden; border-radius: 624.9375rem; background: #eef1f4; animation: boot-out 1ms 8s forwards; }
      #boot .bar i { display: block; width: 33.3333%; height: 100%; border-radius: 624.9375rem; background: #1f7099; animation: boot-sweep 1.4s ease-in-out infinite; }
      #boot .again { position: absolute; top: 50%; left: 50%; visibility: hidden; transform: translate(-50%, -50%); box-sizing: border-box; padding: 0.75rem 1.25rem; border-radius: 0.75rem; background: #1f7099; box-shadow: 0 0.25rem 0 #175573; color: #ffffff; font-size: 1rem; font-weight: 600; line-height: 1.5rem; white-space: nowrap; text-decoration: none; animation: boot-in 1ms 8s forwards; }
      @keyframes boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @keyframes boot-out { to { visibility: hidden; } }
      @keyframes boot-in { to { visibility: visible; } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; margin-left: 2.25rem; } }
      @media (prefers-color-scheme: dark) {
        html, #boot { background: #0d1a22; }
        #boot .bar { background: #223744; }
        #boot .bar i, #boot .again { background: #2177a3; }
      }

    <style>
      /* Built by the boot script below, only for a browser that cannot run the app. Nothing of it exists on a supported browser. */
      #too-old { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 2rem; text-align: center; color: #12232e; background: #e3eefa; background: linear-gradient(135deg, #fef4ec, #e3eefa 50%, #c4e2fe); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      #too-old h1 { margin: 0 0 1.5rem; max-width: 40rem; font-size: 2.75rem; line-height: 1.2; font-weight: 700; }
      #too-old p { margin: 0; max-width: 40rem; font-size: 1.75rem; line-height: 1.5; }
    </style>
    <script>
      // Sets lang and dir before first paint, so a right-to-left page does not
      // flash left-to-right while the app loads.
      (function () {
        var m = document.cookie.match(/(?:^|; )graspy_locale=([^;]*)/);
        var locale = m ? decodeURIComponent(m[1]) : (navigator.language || 'en').split('-')[0].toLowerCase();
        var rtl = ['ar', 'he', 'fa', 'ur', 'ps', 'ku'];
        document.documentElement.lang = locale;
        document.documentElement.dir = rtl.indexOf(locale) !== -1 ? 'rtl' : 'ltr';
      })();

      // The app needs Chromium 108 (cascade layers, dvh). An older browser gets
      // a notice over the page for good. A browser that passes those checks but
      // cannot parse the app's scripts gets it too, until src/main.tsx calls
      // __graspyBooted (all its scripts parsed), so a stray SyntaxError cannot
      // leave it up. The page stays light on purpose, like the art screens.
      // Plain ES5, because this is the one script that runs in every browser.
      (function () {
        var box = null;
        var booted = false;
        var forGood = false;
        function root() {
          return document.getElementById('root');
        }
        function hide() {
          if (!box) return;
          var app = root();
          if (app) {
            app.removeAttribute('inert');
            app.removeAttribute('aria-hidden');
          }
          box.parentNode.removeChild(box);
          box = null;
        }
        function show(permanent) {
          if (permanent) forGood = true;
          if (box || (booted && !forGood)) return;
          if (!document.body || !root()) {
            document.addEventListener('DOMContentLoaded', function () { show(false); });
            return;
          }
          var splash = document.getElementById('boot');
          if (splash) splash.parentNode.removeChild(splash);
          box = document.createElement('div');
          box.id = 'too-old';
          box.setAttribute('role', 'alert');
          box.setAttribute('tabindex', '-1');
          var title = document.createElement('h1');
          title.appendChild(document.createTextNode('This browser is too old for graspy.'));
          var hint = document.createElement('p');
          hint.appendChild(document.createTextNode('Open graspy.getlatentic.com on a phone, tablet or computer, or update your TV’s browser.'));
          box.appendChild(title);
          box.appendChild(hint);
          root().setAttribute('inert', '');
          root().setAttribute('aria-hidden', 'true');
          document.body.appendChild(box);
          box.focus();
        }
        window.__graspyBooted = function () {
          booted = true;
          if (!forGood) hide();
        };
        var modern = typeof window.CSSLayerBlockRule !== 'undefined' &&
          !!(window.CSS && CSS.supports && CSS.supports('height', '1dvh'));
        if (!modern) show(true);
        window.addEventListener('error', function (event) {
          var error = event && event.error;
          if (booted || !(error instanceof SyntaxError)) return;
          if (String(event.filename).indexOf('/assets/') === -1) return;
          var app = root();
          if (app && app.children.length > 0) return;
          show(false);
        });

        // A deploy removes the last build's files. A page the browser kept from before, or one that
        // was mid-download, then asks for a startup file that is gone, and the host answers with a
        // page where a script should be: nothing starts, and nothing says so. A file of the build
        // that fails to load before the app has started reloads the page once, onto the new build.
        // Later failures are src/app/page-chunks.ts's, which uses the same key. Never offline, nor
        // within 10 seconds of the last such reload, nor where storage cannot remember it: those
        // would loop.
        var RELOADED_KEY = 'graspy.reloaded-for-stale-chunk';
        window.addEventListener('error', function (event) {
          var file = event && event.target;
          if (booted || !file || (file.tagName !== 'SCRIPT' && file.tagName !== 'LINK')) return;
          if (String(file.src || file.href).indexOf('/assets/') === -1) return;
          if (navigator.onLine === false) return;
          try {
            var now = Date.now();
            if (now - (Number(sessionStorage.getItem(RELOADED_KEY)) || 0) < 10000) return;
            sessionStorage.setItem(RELOADED_KEY, String(now));
          } catch (storageRefused) {
            return;
          }
          location.reload();
        }, true);
      })();

      // The server starts a fresh instance after a quiet spell and the first request pays for it:
      // asking now, with the page only parsed, lets that wait overlap the scripts' download.
      // The API's address is the preconnect link's, which Vite fills in. src/lib/warm-api.ts
      // asks too when this did not.
      (function () {
        var link = document.querySelector('link[rel="preconnect"]');
        if (!link || !window.fetch) return;
        window.__graspyWarmed = true;
        fetch(link.href + '/health', { cache: 'no-store' }).catch(function () {});
      })();
    </script>
