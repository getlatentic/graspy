    <!-- Opened from the iOS Home Screen the app has no browser bars and the status bar stays above the page, so only the sides and the bottom need the safe-area insets. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="graspy" />
    <!-- The learn screens' top bar in each scheme (design/tokens.css: surface). The manifest's theme_color is the light one, so an installed Android app keeps its status bar colour from launch; a manifest cannot give a dark one. The art screens' ivory top is not matched, the bar being page-wide. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15252F" media="(prefers-color-scheme: dark)" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Personalized, culturally-aware education for children in crisis zones"
    />
    <title>graspy — AI Tutor</title>
    <script>
      // Sets lang and dir before first paint, so a right-to-left page does not
      // flash left-to-right while the app loads.
      (function () {
        var m = document.cookie.match(/(?:^|; )graspy_locale=([^;]*)/);
        var locale = m ? decodeURIComponent(m[1]) : (navigator.language || 'en').split('-')[0].toLowerCase();
        var rtl = ['ar', 'he', 'fa', 'ur', 'ps', 'ku'];
        document.documentElement.lang = locale;
        document.documentElement.dir = rtl.indexOf(locale) !== -1 ? 'rtl' : 'ltr';
      })();
    </script>
